name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest
      - run: python -m pytest
      - run: n8nleaks --version

  action:
    name: Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Clean example passes
        uses: ./
        with:
          paths: examples/clean-workflow.json

      - name: Leaky example fails
        id: leaky
        continue-on-error: true
        uses: ./
        with:
          paths: examples/leaky-workflow.json
          format: text

      - name: Check that it failed
        if: steps.leaky.outcome != 'failure'
        run: |
          echo "The leaky example should have failed the scan."
          exit 1
